name: Check web components

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'public/fonts/**'
      - 'public/assets/netfyr-mark-orange.svg'
      - 'package.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'public/fonts/**'
      - 'public/assets/netfyr-mark-orange.svg'
      - 'package.json'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm run check:web
      - run: npm install --global agent-browser@0.26.0
      - run: agent-browser install --with-deps
      - run: npm run check:web:browser
      - uses: actions/upload-artifact@v4
        with:
          name: web-components
          path: web/dist
